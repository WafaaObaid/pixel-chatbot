<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chatbot UI</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#E6F1FB] flex justify-center items-center min-h-screen p-4">

    <div class="w-full max-w-md h-[90vh] sm:h-[550px] bg-white rounded-2xl flex flex-col overflow-hidden shadow-lg">


        <!-- Header -->
        <div class="bg-white p-4 flex items-center justify-center gap-2 font-bold text-[#0C447C] border-b text-lg">
            <img src="images/rob.jpg" alt="Pixel" class="w-8 h-8 rounded-full"> Pixel
        </div>

        <!-- chat body -->
        <div id="chatBody" class="flex-1 p-4 overflow-y-auto flex flex-col gap-3">
            <div class="flex items-start gap-2">
                <img src="images/rob.jpg" alt="Pixel" class="w-8 h-8 rounded-full">
                <div class="max-w-[75%] px-4 py-2 rounded-xl bg-gray-100 text-gray-800 text-sm sm:text-base">
                    Hello! I am Pixel 🤖 How can I help you?
                </div>
            </div>
            <div class="max-w-[75%] px-4 py-2 rounded-xl bg-[#378ADD] text-white self-end text-sm sm:text-base">

            </div>
        </div>

        <!-- footer -->
        <div class="p-3 border-t bg-white flex gap-2">
            <input id="userInput" type="text" name="" id="" placeholder="Type a message .."
                class="flex-1 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-[#378ADD] text-sm sm:text-base">

            <button id="sendBtn"
                class="bg-[#0C447C] text-white px-4 py-2 rounded-lg hover:opacity-90 text-sm sm:text-base">
                Send
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
    <script src="JS/script.js" defer></script>

</body>

</html>
